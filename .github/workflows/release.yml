name: macOS Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voiceflow-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - run: npm ci
      - name: Import stable signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: ./scripts/import-signing-cert.sh
      - name: Package Release DMG
        run: make dmg
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceFlow.dmg
          path: .build/release/VoiceFlow.dmg
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" .build/release/VoiceFlow.dmg --clobber
          else
            gh release create "$tag" .build/release/VoiceFlow.dmg \
              --title "VoiceFlow ${tag#v}" \
              --generate-notes \
              --verify-tag
          fi
