[package]
name = "voiceflow-speaker-filter"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "Apache-2.0"
description = "Private CPU-only speaker-filter pilot helper for VoiceFlow"

[[bin]]
name = "voiceflow-speaker-filter"
path = "src/main.rs"

[dependencies]
alkove-core = { git = "https://github.com/alkove-ai/alkove.git", rev = "28fe044787952af5b6b6e59b3dd92de2b12eee36" }
alkove-engine = { git = "https://github.com/alkove-ai/alkove.git", rev = "28fe044787952af5b6b6e59b3dd92de2b12eee36" }
hex = "=0.4.3"
hound = "=3.5.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
