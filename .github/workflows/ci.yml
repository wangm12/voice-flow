name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm audit --registry=https://registry.npmjs.org --audit-level=high

  rust:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Signing identity selector tests
        run: ./scripts/select-codesign-identity-test.sh
      - name: VoiceFlow DMG mount listing tests
        run: ./scripts/list-voiceflow-dmg-mounts-test.sh
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin
      - run: cargo check --manifest-path src-tauri/Cargo.toml --target x86_64-apple-darwin

  tauri-config:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npm run build
      - run: npm run tauri -- info

  rust-security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit
        working-directory: src-tauri
