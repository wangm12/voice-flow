# Build VoiceFlow.dmg and attach it to a GitHub Release.
# Source code zip/tar.gz is added by GitHub automatically.
#
# Optional secrets (unsigned builds lose Accessibility on each update):
#   MACOS_CERT_P12         base64-encoded VoiceFlow self-signed .p12
#   MACOS_CERT_PASSWORD    password for that .p12
#
# Cut a release:
#   - Push tag vX.Y.Z matching package.json, or
#   - Actions → Release → Run workflow (uses package.json version)

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: voiceflow-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

jobs:
  ci:
    name: CI gates
    uses: ./.github/workflows/ci.yml

  release-preflight:
    name: Validate release tag and source commit
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      target_sha: ${{ steps.release.outputs.target_sha }}
      require_existing_tag: ${{ steps.release.outputs.require_existing_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate release ref before signing setup
        id: release
        run: ./scripts/release.sh prepare

  build-mac:
    name: macOS DMG
    needs: [ci, release-preflight]
    runs-on: macos-15
    timeout-minutes: 90
    outputs:
      signing_status: ${{ steps.resolve-signing.outputs.signing_status }}
      dmg_path: ${{ steps.resolve-signing.outputs.dmg_path }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26 and verify Swift 6.2
        run: ./scripts/select-xcode-26.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org

      - name: Import stable signing certificate
        timeout-minutes: 3
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: ./scripts/import-signing-cert.sh

      - name: Resolve actual DMG signing state
        id: resolve-signing
        env:
          VOICEFLOW_ALLOW_UNSIGNED: ${{ vars.VOICEFLOW_ALLOW_UNSIGNED }}
        run: |
          signing_env="$(./scripts/resolve-dmg-signing.sh)"
          eval "$signing_env"
          if [ -n "$APPLE_SIGNING_IDENTITY" ] && [ -n "$APPLE_TEAM_ID" ]; then
            signing_status=signed
            dmg_path=.build/release/VoiceFlow.dmg
          elif [ -z "$APPLE_SIGNING_IDENTITY" ] && [ -z "$APPLE_TEAM_ID" ] && [ "$VOICEFLOW_ALLOW_UNSIGNED" = "1" ]; then
            signing_status=unsigned
            dmg_path=.build/release/VoiceFlow-unsigned.dmg
          else
            echo "error: resolver returned an invalid signing identity/team combination" >&2
            exit 1
          fi
          echo "signing_status=$signing_status" >> "$GITHUB_OUTPUT"
          echo "dmg_path=$dmg_path" >> "$GITHUB_OUTPUT"
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
          echo "VOICEFLOW_ALLOW_UNSIGNED=$VOICEFLOW_ALLOW_UNSIGNED" >> "$GITHUB_ENV"
          echo "VOICEFLOW_RELEASE_SIGNING_STATUS=$signing_status" >> "$GITHUB_ENV"

      - name: Package Release DMG
        run: make dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ steps.resolve-signing.outputs.signing_status }}
          path: ${{ steps.resolve-signing.outputs.dmg_path }}
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [ci, release-preflight, build-mac]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download the resolved signing artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg-${{ needs.build-mac.outputs.signing_status }}
          path: artifacts

      - name: Require installer artifact
        env:
          SIGNING_STATUS: ${{ needs.build-mac.outputs.signing_status }}
          DMG_PATH: ${{ needs.build-mac.outputs.dmg_path }}
        run: |
          asset="${DMG_PATH##*/}"
          test -f "artifacts/$asset"
          ls -lh "artifacts/$asset"
          printf 'VoiceFlow release signing status: %s. This describes code signing only; it does not claim Apple notarization.\n' "$SIGNING_STATUS" > release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-preflight.outputs.release_tag }}
          RELEASE_TARGET_SHA: ${{ needs.release-preflight.outputs.target_sha }}
          REQUIRE_EXISTING_TAG: ${{ needs.release-preflight.outputs.require_existing_tag }}
          DMG_PATH: ${{ needs.build-mac.outputs.dmg_path }}
        run: ./scripts/release.sh publish
